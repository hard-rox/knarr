name: CD

on:
  push:
    tags:
      - "v*"

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: Knarr.slnx
  APP_PROJECT: src/Knarr.App/Knarr.App.csproj
  APP_NAME: Knarr

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # Job 1: Test, coverage & SonarCloud analysis
  # ---------------------------------------------------------------------
  test-and-analysis:
    name: Test & Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # - name: Setup Java (required by SonarScanner)
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: zulu
      #     java-version: "17"

      # - name: Cache SonarCloud packages
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.sonar/cache
      #     key: ${{ runner.os }}-sonar
      #     restore-keys: ${{ runner.os }}-sonar

      # - name: Install dotnet-sonarscanner
      #   run: dotnet tool install --global dotnet-sonarscanner

      # - name: Begin SonarCloud analysis
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   run: |
      #     dotnet-sonarscanner begin \
      #       /k:"${{ secrets.SONAR_PROJECT_KEY }}" \
      #       /o:"${{ secrets.SONAR_ORGANIZATION }}" \
      #       /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
      #       /d:sonar.host.url="https://sonarcloud.io" \
      #       /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml" \
      #       /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test with coverage (cobertura + opencover)
        run: >
          dotnet test ${{ env.SOLUTION }} -c Release --no-build
          --results-directory ./coverage
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover

      # - name: End SonarCloud analysis
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Generate markdown coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "coverage/**/coverage.cobertura.xml"
          badge: true
          fail_below_min: false
          format: markdown
          output: both

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: code-coverage-results.md
          retention-days: 7

  # ---------------------------------------------------------------------
  # Job 2: Build & package for Windows (portable ZIP, MSIX, MSI)
  # ---------------------------------------------------------------------
  build-windows:
    name: Build Windows
    needs: test-and-analysis
    runs-on: windows-latest
    env:
      PUBLISH_DIR: publish/portable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish win-x64 (self-contained)
        run: >
          dotnet publish ${{ env.APP_PROJECT }} -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o ${{ env.PUBLISH_DIR }}

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ env.PUBLISH_DIR }}/*" -DestinationPath "./${{ env.APP_NAME }}-win-x64-portable.zip"

      - name: Stage MSIX payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./publish/msix | Out-Null
          Copy-Item -Recurse -Force "${{ env.PUBLISH_DIR }}/*" ./publish/msix/
          Copy-Item -Force "src/Knarr.App/AppxManifest.xml" ./publish/msix/AppxManifest.xml
          New-Item -ItemType Directory -Force -Path ./publish/msix/Assets | Out-Null
          Copy-Item -Force "src/Knarr.App/Assets/knarr-logo.png" ./publish/msix/Assets/Logo.png

      - name: Build MSIX with MakeAppx
        shell: pwsh
        run: |
          $makeAppx = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "makeappx.exe" |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeAppx) { throw "makeappx.exe not found on runner image" }
          & $makeAppx pack /d ./publish/msix /p "./${{ env.APP_NAME }}-win-x64.msix" /o

      - name: Install WiX Toolset
        run: dotnet tool install --global WixToolset.Tools

      - name: Build MSI with WiX
        shell: pwsh
        run: |
          $publishDir = (Resolve-Path "${{ env.PUBLISH_DIR }}").Path
          wix build ./Setup.wxs -arch x64 -d PublishDir="$publishDir" -o "./${{ env.APP_NAME }}-win-x64.msi"

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-zip
          path: "${{ env.APP_NAME }}-win-x64-portable.zip"

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: "${{ env.APP_NAME }}-win-x64.msix"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: "${{ env.APP_NAME }}-win-x64.msi"

  # ---------------------------------------------------------------------
  # Job 3: Build & package for macOS (.app bundle, zipped)
  # ---------------------------------------------------------------------
  build-macos:
    name: Build macOS
    needs: test-and-analysis
    runs-on: macos-latest
    env:
      PUBLISH_DIR: publish/osx-x64
      BUNDLE_DIR: Knarr.app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish osx-x64 (self-contained)
        run: >
          dotnet publish ${{ env.APP_PROJECT }} -c Release -r osx-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o ${{ env.PUBLISH_DIR }}

      - name: Assemble .app bundle
        run: |
          mkdir -p "${{ env.BUNDLE_DIR }}/Contents/MacOS"
          mkdir -p "${{ env.BUNDLE_DIR }}/Contents/Resources"
          cp -R "${{ env.PUBLISH_DIR }}"/* "${{ env.BUNDLE_DIR }}/Contents/MacOS/"
          cp "src/Knarr.App/Info.plist" "${{ env.BUNDLE_DIR }}/Contents/Info.plist"
          cp "src/Knarr.App/Knarr.icns" "${{ env.BUNDLE_DIR }}/Contents/Resources/Knarr.icns"
          chmod +x "${{ env.BUNDLE_DIR }}/Contents/MacOS/Knarr.App"

      - name: Zip .app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "${{ env.BUNDLE_DIR }}" "${{ env.APP_NAME }}-osx-x64.app.zip"

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-zip
          path: "${{ env.APP_NAME }}-osx-x64.app.zip"

  # ---------------------------------------------------------------------
  # Job 4: Publish GitHub Release with all artifacts + coverage summary
  # ---------------------------------------------------------------------
  release:
    name: Release
    needs: [test-and-analysis, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release body
        run: |
          {
            echo "## ${{ env.APP_NAME }} ${{ github.ref_name }}"
            echo ""
            echo "### Code Coverage"
            echo ""
            cat artifacts/coverage-summary/code-coverage-results.md
          } > RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: |
            artifacts/windows-portable-zip/*.zip
            artifacts/windows-msix/*.msix
            artifacts/windows-msi/*.msi
            artifacts/macos-app-zip/*.zip
