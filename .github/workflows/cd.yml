name: CD

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-test:
    name: Build & Test with coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Knarr.slnx

      - name: Build
        run: dotnet build Knarr.slnx -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test Knarr.slnx -c Release --no-build --verbosity normal
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory ./coverage

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Merge coverage report
        run: >
          reportgenerator
          -reports:"./coverage/**/coverage.cobertura.xml"
          -targetdir:"./coverage/report"
          -reporttypes:"Cobertura;Html"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/report

      # ---------------------------------------------------------------------------------
      # TODO: enable once a SonarCloud project exists for this repo and the SONAR_TOKEN
      # secret has been added (Settings > Secrets and variables > Actions). Requires a
      # Java runtime on the runner (actions/setup-java) in addition to the .NET SDK.
      # ---------------------------------------------------------------------------------
      # - name: Setup Java (required by the Sonar scanner)
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: "temurin"
      #     java-version: "17"
      #
      # - name: Install Sonar scanner
      #   run: dotnet tool install --global dotnet-sonarscanner
